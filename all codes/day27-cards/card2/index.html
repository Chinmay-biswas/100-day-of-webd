<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <img id="card-image" src="images.jpg" alt="">
            <div class="textbox">
                <h2>Space astronaut</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolore, atque?</p>
            </div>
            <div id="amount">
                <div id="leftbox">
                    <img src="download.jpg" alt="">
                    <div class="amounttext">
                        <p>amount</p>
                        <p>$100</p>

                    </div>

                </div>
                <div class="rightbox">
                    <a href="#">change</a>

                </div>

            </div>

            <button id="buybutton">Buy Now</button>
            <div class="cancle">
                cancle order
            </div>


        </div>
    </div>
    
</body>
</html>
