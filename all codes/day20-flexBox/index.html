<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            background-color: rgb(96, 56, 134);
            border: 6px solid red;
            margin: 2px;
            padding: 2px;
            display: flex;
            flex-direction: column;
            height: 500px;
        }
        .box{
            background-color: beige;
            height: 200px;
            width: 200px;
            border: 1px solid black;
            margin: 4px;

        }
        #box1{
            background-color: rgb(39, 184, 61);

        }
        #box2{
            background-color: rgb(167, 133, 40);
        }
        #box3{
            background-color: rgb(140, 9, 15);
        }
        #box4{
            background-color: rgb(50, 50, 192);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>
    </div>
    
</body>
</html>
