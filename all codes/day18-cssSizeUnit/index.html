<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 2px solid red;
            width: 50%;
        }
        .parent{
            border: solid 3px green;
            background-color: green;
            width: 50%;

        }
        .child{
            border: 1px solid blue;
            width: 20%;
            background-color: blue;
        }
        .container{
            background-color: aqua;
            border: solid green 2px;
            height: 100vh;
            width: 60vh;
        }
        .box1{
            border: 2px solid gray;
            font-size: 100px;
        }
        .wrapper{
            border: 2px solid rgb(158, 16, 16);
            font-size: 1em;

        }
        .boxpx{
            border: 2px solid gray;
            font-size: 20px;
        }
        .boxvw{
            border: 2px solid gray;
            font-size: 5vw;
        }
        .boxem{
            border: 2px solid gray;
            font-size: 10em;
        }
    </style>
</head>
<body>

    <div class="box">
        welcome to here
    </div>

    <div class="parent">
        <div class="child">child</div>
    </div>

    <div class="container">welcome here to here</div>

    <div class="box1">
        chinmay biswas
    </div>
    <div class="wrapper">
        <div class="boxpx">i am 200px wide</div>
        <div class="boxvw">i am vw wide</div>
        <div class="boxem">i am em wide</div>
    </div>
    
</body>
</html>
